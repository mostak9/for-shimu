# ✦ Publishes the site to GitHub Pages automatically.
#
# How it works:
#   Every time you push to the "main" branch, GitHub builds the site
#   (and runs the interaction smoke test) then publishes it.
#
# One-time setup on GitHub:
#   Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
name: Deploy site to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch: # allows a manual "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run interaction smoke test
        run: npm run test:smoke

      - name: Build the site
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
